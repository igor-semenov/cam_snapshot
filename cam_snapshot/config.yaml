name: Camera Snapshot
version: "1.0.0"
slug: cam_snapshot
description: >-
  Publishes the latest motionEye still image on a stable tokenized URL so that
  devices which cannot log in interactively (e.g. a MagicMirror) can simply
  fetch http://<host>:8099/snapshot.jpg?token=...
url: https://github.com/igor-semenov/cam_snapshot/tree/main/cam_snapshot
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
host_network: true
image: ghcr.io/igor-semenov/cam-snapshot
options:
  motioneye_url: http://127.0.0.1:8765
  camera_id: 1
  username: admin
  password: ""
  token: ""
  refresh_seconds: 1
  stale_after_seconds: 60
  port: 8099
schema:
  motioneye_url: url
  camera_id: int(1,)
  username: str
  password: password
  token: str
  refresh_seconds: float(0.2,60)
  stale_after_seconds: int(5,3600)
  port: port
