name: Build

on:
  push:
    branches:
      - main
    paths:
      - "cam_snapshot/**"
      - ".github/workflows/build.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "cam_snapshot/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    if: github.repository == 'igor-semenov/cam_snapshot'
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./cam_snapshot"

      - name: Normalize app information
        id: normalize
        env:
          APP_IMAGE: ${{ steps.info.outputs.image }}
          APP_VERSION: ${{ steps.info.outputs.version }}
          APP_NAME: ${{ steps.info.outputs.name }}
          APP_DESCRIPTION: ${{ steps.info.outputs.description }}
          APP_URL: ${{ steps.info.outputs.url }}
        run: |
          echo "image_name=${APP_IMAGE##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${APP_IMAGE%/*}" >> "$GITHUB_OUTPUT"
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          # Values are passed via env: free text such as "..." or "(...)" is not
          # safe to interpolate straight into the shell.
          {
            echo "description<<__DESCRIPTION__"
            echo "$APP_DESCRIPTION"
            echo "__DESCRIPTION__"
          } >> "$GITHUB_OUTPUT"
          if [[ -n "$APP_URL" && "$APP_URL" != "null" ]]; then
            echo "url=${APP_URL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./cam_snapshot"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs:
      - prepare
      - build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
